# Builds AlgorithmStudy.exe on Windows, smoke-tests it, and attaches it to the GitHub Release
# when you push a version tag (git tag v1.0.0 && git push origin v1.0.0).
# You can also run it by hand: Actions -> "Build Windows executable" -> Run workflow;
# the .exe is then available under that run's "Artifacts".
name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release and upload the .exe

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Create build environment
        run: python -m venv .venv

      - name: Build with build.bat
        shell: cmd
        run: call build.bat

      - name: Smoke-test the executable
        run: .venv\Scripts\python.exe tests\smoke_exe.py dist\AlgorithmStudy.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgorithmStudy-windows
          path: dist/AlgorithmStudy.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AlgorithmStudy.exe
          generate_release_notes: true
